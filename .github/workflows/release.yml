# 发布流水线：构建 release 产物并创建 GitHub Release。
# 由 v* 标签触发；tag 事件偶发丢失或损坏时，可手动触发补发布。
# 第三方 action 一律以 commit SHA 固定引用，行尾注释标注对应版本号或分支。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo build --release --locked
      - name: 组装发布正文
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $size = "{0:N1}MB" -f ((Get-Item target/release/Quotify.exe).Length / 1MB)
          (Get-Content .github/release-template.md -Raw) `
            -replace '\{tag\}', $tag -replace '\{size\}', $size |
            Set-Content release-body.md
      - name: 生成校验和
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/Quotify.exe -Algorithm SHA256).Hash
          "$hash  Quotify.exe" | Set-Content SHA256SUMS.txt
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            target/release/Quotify.exe
            SHA256SUMS.txt
          body_path: release-body.md
          generate_release_notes: true
