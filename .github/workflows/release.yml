# 发布流水线：构建 release 产物并创建 GitHub Release。
# 由 v* 标签触发；tag 事件偶发丢失或损坏时，可手动触发补发布。
# 第三方 action 一律以 commit SHA 固定引用，行尾注释标注对应版本号或分支。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 校验 tag 与版本号一致
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) {
            throw "tag v$tag 与 Cargo.toml version $ver 不一致，发版前请同步 bump 版本号"
          }
          $head = (Select-String -Path docs/WHAT_IS_NEW.md -Pattern '^## ').Line | Select-Object -First 1
          if ($head -notmatch ("v" + [regex]::Escape($tag) + "(?![.\d])")) {
            throw "WHAT_IS_NEW 顶节「$head」未提及 v$tag，请先补本版动态"
          }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo build --release --locked
      - name: 组装发布正文
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $size = "{0:N1}MB" -f ((Get-Item target/release/Quotify.exe).Length / 1MB)
          $lines = Get-Content docs/WHAT_IS_NEW.md
          $heads = @($lines | Select-String '^## ')
          if (-not $heads.Count) {
            throw "WHAT_IS_NEW 无任何 ## 分节，亮点段将误取全文，请检查文档"
          }
          $start = $heads[0].LineNumber
          $end = if ($heads.Count -gt 1) { $heads[1].LineNumber } else { $lines.Count + 1 }
          $slice = if ($end - 2 -ge $start) { $lines[$start..($end - 2)] } else { @() }
          $highlights = @(
            $slice |
              Where-Object { $_.Trim() } |
              ForEach-Object { $_.Trim() -replace '^\d+、\s*', '- ' }
          ) -join "`n"
          if (-not $highlights) {
            throw "WHAT_IS_NEW 顶节无正文，亮点段将为空，请补本版动态"
          }
          $tpl = Get-Content .github/release-template.md -Raw
          $tpl = $tpl.Replace('{tag}', $tag).Replace('{size}', $size).Replace('{highlights}', $highlights)
          Set-Content release-body.md $tpl
      - name: 生成校验和
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/Quotify.exe -Algorithm SHA256).Hash
          "$hash  Quotify.exe" | Set-Content SHA256SUMS.txt
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            target/release/Quotify.exe
            SHA256SUMS.txt
          body_path: release-body.md
          generate_release_notes: true
